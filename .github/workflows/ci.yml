name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  build:
    name: Lint, typkontroll och bygge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Regel: PR:er mot main får endast komma från staging
  enforce-staging:
    name: PR mot main måste komma från staging
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera källgren
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "::error::PR:er mot main får endast komma från 'staging' (nuvarande källgren: ${{ github.head_ref }})"
            exit 1
          fi
